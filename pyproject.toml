
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "EduLib"
version = "0.1.2"
description = "Biblioteca multipropósito de Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["edulib*"]

[project.optional-dependencies]
math = ["sympy>=1.13"]
